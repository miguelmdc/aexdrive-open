<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Drive Folder</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2.5rem; color: #1f2937; }
    .btn { display: inline-block; padding: 0.65rem 1.15rem; background: #00667E; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .btn:hover { background: #005266; }
    .sec { margin-left: 1rem; color: #0079d1; text-decoration: underline; }
    .tip { margin-top: 0.75rem; font-size: 0.9rem; color: #6b7280; }
    .actions { margin-top: 1.25rem; }
  </style>
</head>
<body>
  <h2 id="msg" style="margin:0;font-size:1.15rem;">Open folder in Windows Explorer</h2>
  <p id="tip" class="tip" hidden>First time: tick "Always allow" in Chrome's prompt, or click the button below.</p>
  <div id="actions" class="actions" hidden>
    <a id="exp" class="btn" href="#">Open in Windows Explorer</a>
    <a id="drv" class="sec" href="#" target="_blank" rel="noopener">Open in Google Drive</a>
  </div>
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('id') || '';
      var msg = document.getElementById('msg');
      if (!/^[A-Za-z0-9_-]{10,64}$/.test(id)) {
        msg.textContent = 'Missing or invalid folder ID.';
        return;
      }
      var explorerUrl = 'aexdrive://open?id=' + encodeURIComponent(id);
      var driveUrl = 'https://drive.google.com/drive/folders/' + encodeURIComponent(id);
      document.getElementById('exp').href = explorerUrl;
      document.getElementById('drv').href = driveUrl;
      document.getElementById('tip').hidden = false;
      document.getElementById('actions').hidden = false;

      var launchedAt = Date.now();
      window.addEventListener('blur', function () {
        if (Date.now() - launchedAt < 8000) {
          setTimeout(function () { window.close(); }, 600);
        }
      });

      window.location.href = explorerUrl;
    })();
  </script>
</body>
</html>
